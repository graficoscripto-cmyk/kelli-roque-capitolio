  <!-- Flowing Waves -->
  <path d="M22 69 C38 78 58 60 94 72 C74 68 54 84 22 69 Z" fill="url(#waveGrad)"/>
  <path d="M26 80 C44 88 64 72 96 64 C78 82 52 94 26 80 Z" fill="#38BDF8"/>
