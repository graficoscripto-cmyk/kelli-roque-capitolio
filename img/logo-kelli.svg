<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="120" x2="120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="60" y1="8" x2="60" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071B36"/>
      <stop offset="100%" stop-color="#041022"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="20" y1="75" x2="100" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <!-- Outer glowing ring -->
  <circle cx="60" cy="60" r="54" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="4"/>
  <circle cx="60" cy="60" r="48" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1"/>
